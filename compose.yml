# is-an.ai DNS infrastructure — single compose project, single network namespace.
#
# Deliberately ONE project. Splitting these services across compose projects
# means joining them with `external: true` networks whose names derive from
# directory names, which breaks silently when a directory is renamed.
#
# WARNING: `docker compose down` stops production DNS. For routine work use
#   docker compose up -d <service>      /  docker compose restart <service>

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  pdns-auth:
    build:
      context: ./pdns
    image: is-an-ai/pdns-auth:local
    container_name: pdns-auth
    depends_on:
      pdns-db:
        condition: service_healthy
    ports:
      # UDP/53 MUST stay published. HE's secondaries poll SOA over UDP on the
      # zone's refresh timer (10800s); if that is blocked and HE does not fall
      # back to TCP, nothing breaks until `expire` (604800s) elapses and HE
      # stops serving the zone entirely — a silent, week-delayed outage.
      #
      # NS records cannot be used to reason about this: HE transfers from
      # 216.218.133.2 / 2001:470:600::2, which appear in none of ns1-5.he.net.
      # Restrict by SOURCE IP at the cloud security group instead: Docker's
      # published ports cannot filter by source, and they bypass UFW/iptables
      # INPUT (use the DOCKER-USER chain to filter on the host).
      # Run tools/measure-inbound-53.sh for >4h before narrowing anything.
      - "53:53/tcp"
      - "53:53/udp"
      # API 발행 주소는 env 로 뺀다. 서버는 기본값 그대로, 로컬 검증만 다른 포트를 쓴다.
      #
      # 왜: 이 프로젝트는 운영 서버로 `ssh -L 8081:127.0.0.1:8081` 터널을 여는 게 일상이다.
      # 터널이 먼저 바인딩한 상태에서 로컬 스택을 띄우면 `docker port` 는 발행 성공으로
      # 보이지만 실제로 듣는 쪽은 ssh 다. 그러면 127.0.0.1:8081 로 보낸 API 호출이
      # 전부 운영 PowerDNS 로 간다. 2026-09-03 에 실제로 그랬고, 운영에 같은 이름이
      # CNAME 으로 실존해 쓰기가 거부된 덕에 사고가 안 났다.
      #
      # 이 포트는 사람이 들여다볼 때만 쓴다. 러너와 gatus 는 `ops` 네트워크에서
      # http://pdns-auth:8081 로 직접 붙으므로 값을 바꿔도 영향이 없다.
      - "${PDNS_API_BIND:-127.0.0.1:8081}:8081"
    # Only the keys PowerDNS needs. Using `env_file: [.env]` would also
    # inject the gatus password hash and the Slack webhook into this container.
    environment:
      PDNS_DB_NAME: ${PDNS_DB_NAME}
      PDNS_DB_USER: ${PDNS_DB_USER}
      PDNS_DB_PASSWORD: ${PDNS_DB_PASSWORD}
      PDNS_API_KEY: ${PDNS_API_KEY}
      # `-` not `:-`: an explicitly empty value in .env must survive, so a local
      # verification run can stop NOTIFY from reaching the secondary. Unset =
      # the real HE address, which is what the server has.
      PDNS_ALSO_NOTIFY: ${PDNS_ALSO_NOTIFY-216.218.130.2}
      # The bridge range differs by engine (Docker 172.16/12, OrbStack 192.168/16),
      # and a request from outside it is dropped silently. Override locally.
      PDNS_WEBSERVER_ALLOW_FROM: ${PDNS_WEBSERVER_ALLOW_FROM:-127.0.0.1,::1,172.16.0.0/12}
    networks: [data, ops]
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    healthcheck:
      # `ping` 은 이 이미지의 pdns_control 에 없는 명령이다 -> Unknown command: 'PING'
      # 그래서 컨테이너가 정상인데도 영원히 unhealthy 로 뜨고, 진짜 장애와 구분이 안 됐다.
      # 올바른 이름은 rping (`pdns_control help` 참조).
      test: ["CMD-SHELL", "pdns_control rping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  pdns-db:
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: pdns-db
    # No published ports: pdns-auth and backup reach it over the `data` network.
    environment:
      POSTGRES_DB: ${PDNS_DB_NAME}
      POSTGRES_USER: ${PDNS_DB_USER}
      POSTGRES_PASSWORD: ${PDNS_DB_PASSWORD}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}/pgdata:/var/lib/postgresql/data
    networks: [data]
    mem_limit: 1g
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PDNS_DB_USER} -d ${PDNS_DB_NAME} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gatus:
    image: ${GATUS_IMAGE:-twinproduction/gatus:latest}
    container_name: gatus
    depends_on: [pdns-auth]
    ports:
      # Localhost only. Reach it over an SSH tunnel:
      #   ssh -L 8080:127.0.0.1:8080 <user>@<host>
      - "127.0.0.1:8080:8080"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PDNS_API_KEY: ${PDNS_API_KEY}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      GATUS_BASIC_USERNAME: ${GATUS_BASIC_USERNAME}
      GATUS_BASIC_PASSWORD_BCRYPT: ${GATUS_BASIC_PASSWORD_BCRYPT}
    volumes:
      # Mounted at gatus's default config path. Do not set GATUS_CONFIG_FILE
      # unless it names exactly this path: if it points anywhere else, gatus
      # loads a different config and the security block below never applies.
      - ./gatus/config.yaml:/config/config.yaml:ro
    networks: [ops]
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

  github-runner:
    build:
      context: ./runner
    image: is-an-ai/github-runner:local
    container_name: github-runner
    env_file: [runner/.env]
    # _work stays in the container layer (no host bind mount). Recreating the
    # container clears it, which is why no cleaner sidecar is needed.
    networks: [ops]
    mem_limit: 2g
    cpus: 2
    logging: *logging
    healthcheck:
      test: ["CMD", "test", "-f", "/home/runner/actions-runner/.runner"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

  backup:
    image: ${POSTGRES_IMAGE:-postgres:17}
    container_name: pdns-backup
    depends_on:
      pdns-db:
        condition: service_healthy
    environment:
      PGHOST: pdns-db
      PGUSER: ${PDNS_DB_USER}
      PGPASSWORD: ${PDNS_DB_PASSWORD}
      PGDATABASE: ${PDNS_DB_NAME}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}/backups:/backups
    entrypoint: ["/bin/bash", "/backup.sh"]
    networks: [data]
    mem_limit: 256m
    logging: *logging
    restart: unless-stopped

networks:
  # pdns-db is reachable only from `data`, so the CI runner cannot touch
  # PostgreSQL directly (it could on the old shared network).
  data:
    driver: bridge
  ops:
    driver: bridge
